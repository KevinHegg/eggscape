name: Publish The Great Eggscape

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test and build
        run: npm ci && npm run typecheck && npm test && npm run build
        env:
          GITHUB_ACTIONS: true
      # The first game, the Queen's gauntlet, is kept as it was and served beside the new one.
      - name: Check out the first game
        uses: actions/checkout@v4
        with:
          ref: gauntlet-v1
          path: gauntlet-src
      - name: Build the first game into /gauntlet/
        run: cd gauntlet-src && npm ci && npx vite build --base=/eggscape/gauntlet/ --outDir ../dist/gauntlet --emptyOutDir
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Its own job, after the build: deploying in the same breath as the upload has failed to find the artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
